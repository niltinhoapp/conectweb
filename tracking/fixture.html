<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tracker test fixture</title>
<script>
(function () {
  var params = new URLSearchParams(location.search);

  // Instrumentacao para o teste de "independencia de rede": registra
  // qualquer tentativa de chamada de rede feita pela pagina (deveria
  // ficar sempre vazio, ja que o tracker.js nao faz nenhuma chamada
  // de rede para funcionar). Nao interfere no funcionamento normal -
  // so observa e deixa a chamada original prosseguir.
  window.__cwNetworkCalls = [];
  var origFetch = window.fetch;
  if (typeof origFetch === 'function') {
    window.fetch = function () {
      window.__cwNetworkCalls.push({ type: 'fetch', arg: String(arguments[0]) });
      return origFetch.apply(this, arguments);
    };
  }
  var origOpen = window.XMLHttpRequest && window.XMLHttpRequest.prototype.open;
  if (origOpen) {
    window.XMLHttpRequest.prototype.open = function (method, url) {
      window.__cwNetworkCalls.push({ type: 'xhr', arg: String(url) });
      return origOpen.apply(this, arguments);
    };
  }
  if (navigator.sendBeacon) {
    var origBeacon = navigator.sendBeacon.bind(navigator);
    navigator.sendBeacon = function (url) {
      window.__cwNetworkCalls.push({ type: 'sendBeacon', arg: String(url) });
      return origBeacon.apply(navigator, arguments);
    };
  }

  var seedKey = params.get('t_seed_key');
  var seedValue = params.get('t_seed_value');
  if (seedKey && seedValue) {
    try { window.localStorage.setItem(seedKey, seedValue); } catch (e) {}
  }

  var s = document.createElement('script');
  s.src = '/tracking/tracker.js?_=' + Date.now();
  s.setAttribute('data-debug', 'true');
  if (params.get('t_account')) s.setAttribute('data-account', params.get('t_account'));
  if (params.get('t_consent_required')) s.setAttribute('data-consent-required', params.get('t_consent_required'));
  if (params.get('t_consent_granted')) s.setAttribute('data-consent-granted', params.get('t_consent_granted'));
  if (params.get('t_consent_cookie')) s.setAttribute('data-consent-cookie', params.get('t_consent_cookie'));
  if (params.get('t_consent_cookie_value')) s.setAttribute('data-consent-cookie-value', params.get('t_consent_cookie_value'));
  if (params.get('t_decorate_domains')) s.setAttribute('data-decorate-domains', params.get('t_decorate_domains'));
  document.head.appendChild(s);
})();
</script>
</head>
<body>
  <a id="linkInternal" href="/tracking/fixture.html?other=1">interno</a>
  <a id="linkHotmart" href="https://pay.hotmart.com/TESTE">hotmart</a>
  <a id="linkKiwify" href="https://pay.kiwify.com.br/TESTE">kiwify</a>
  <a id="linkExternal" href="https://exemplo-nao-listado.com/parceiro">externo nao listado</a>
  <form id="formInitial" action="#"><input name="nome"></form>
  <form id="formLead" data-cw-lead action="#"><input name="nome"></form>
  <form id="formNoLead" action="#"><input name="nome"></form>

  <script>
    // Impede navegacao real ao submeter nos testes. O listener do tracker
    // roda na fase de captura em document, entao dispara antes deste.
    ['formInitial', 'formLead', 'formNoLead'].forEach(function (id) {
      var f = document.getElementById(id);
      if (f) f.addEventListener('submit', function (e) { e.preventDefault(); });
    });

    window.__cwSubmit = function (id) {
      var f = document.getElementById(id);
      if (!f) return false;
      return f.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
    };

    window.__cwAddDynamicLink = function () {
      var a = document.createElement('a');
      a.id = 'linkDynamic';
      a.href = 'https://pay.hotmart.com/DINAMICO';
      document.body.appendChild(a);
      return a;
    };
    window.__cwAddDynamicForm = function () {
      var f = document.createElement('form');
      f.id = 'formDynamic';
      document.body.appendChild(f);
      return f;
    };
    window.__cwAddNestedForm = function () {
      var wrap = document.createElement('div');
      var f = document.createElement('form');
      f.id = 'formNested';
      wrap.appendChild(f);
      document.body.appendChild(wrap);
      return f;
    };
    window.__cwChangeHref = function (newHref) {
      var a = document.getElementById('linkInternal');
      a.setAttribute('href', newHref);
      return a;
    };
    window.__cwPushState = function (url) {
      history.pushState({}, '', url);
    };
  </script>
</body>
</html>
