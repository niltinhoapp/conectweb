<body>
  <h1>ConnectWeb Tracking — Suíte de testes V1.2</h1>
  <p>Roda no navegador, sem dependências externas. Cada teste usa uma <code>data-account</code> própria para isolar o storage.</p>
  <div id="summary">Rodando…</div>
  <table>
    <thead><tr><th style="width:26px">#</th><th style="width:260px">Cenário</th><th style="width:70px">Resultado</th><th>Detalhe</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

<script>
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function storageKeyFor(account) {
  var slug = account ? account.replace(/[^a-zA-Z0-9_-]/g, '_') : 'default';
  return '__cw_tracking_v1____' + slug;
}

function createIframe() {
  var f = document.createElement('iframe');
  f.style.width = '1px'; f.style.height = '1px';
  document.body.appendChild(f);
  return f;
}

function navigate(iframe, url) {
  return new Promise(function (resolve) {
    iframe.addEventListener('load', function onLoad() {
      iframe.removeEventListener('load', onLoad);
      resolve();
    });
    iframe.src = url;
  });
}

async function waitFor(fn, timeout) {
  var start = Date.now();
  while (Date.now() - start < timeout) {
    try { if (fn()) return true; } catch (e) {}
    await sleep(25);
  }
  return false;
}

async function waitReady(iframe, timeout) {
  return waitFor(function () {
    return !!(iframe.contentWindow && iframe.contentWindow.ConnectWebTracking);
  }, timeout || 3000);
}

// Cada execucao da suite usa um RUN_ID unico nas contas de teste, para
// nunca reaproveitar localStorage/cookies deixados por uma execucao
// anterior no mesmo navegador (o storage e por account, nao por sessao
// de teste).
var RUN_ID = Date.now().toString(36);

function fixtureUrl(params) {
  if (params.t_account) params.t_account = params.t_account + '_' + RUN_ID;
  var qs = Object.keys(params).map(function (k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');
  return '/tracking/fixture.html?' + qs;
}

function storageKeyForTest(account) {
  return storageKeyFor(account + '_' + RUN_ID);
}

function assert(cond, okMsg, failMsg) {
  return { pass: !!cond, message: cond ? okMsg : failMsg };
}

var results = [];

// Cada teste usa uma account propria, e o tracker grava um cookie de
// fallback por account. Com dezenas de testes o cabecalho Cookie cresce
// ate estourar o limite de linha de servidores de desenvolvimento simples
// (HTTP 431), quebrando as navegacoes seguintes. Isso e artefato do
// ambiente de teste, nao do produto - entao limpamos os cookies do tracker
// ao final de cada teste. Nao afeta nenhuma assercao: elas rodam antes.
function clearTrackingCookies() {
  try {
    document.cookie.split(';').forEach(function (chunk) {
      var name = chunk.split('=')[0].trim();
      if (name.indexOf('cw_tracking') === 0) {
        document.cookie = name + '=; Max-Age=0; Path=/; SameSite=Lax';
      }
    });
  } catch (e) {}
}

async function runTest(name, fn) {
  var iframe = createIframe();
  var outcome;
  try {
    outcome = await fn(iframe);
  } catch (err) {
    outcome = { pass: false, message: 'Excecao: ' + (err && err.message ? err.message : String(err)) };
  }
  results.push({ name: name, pass: outcome.pass, message: outcome.message });
  iframe.parentNode && iframe.parentNode.removeChild(iframe);
  clearTrackingCookies();
}

// 1. Acesso direto
async function testDirect(iframe) {
  await navigate(iframe, fixtureUrl({ t_account: 't01_direct' }));
  await waitReady(iframe);
  var data = iframe.contentWindow.ConnectWebTracking.get();
  var ft = data.first_touch || {};
  var ftEmpty = Object.keys(ft).length === 0;
  // Dentro do iframe de teste, document.referrer aponta para tests.html
  // (mesma origem) - por isso o classifySource acerta "internal" em vez
  // de "direct" (nao ha unico "direct" real neste harness sem referrer).
  // Ambos sao classificacoes corretas de "sem campanha"; o que importa
  // aqui e o first_touch vazio.
  var ok = ftEmpty && (data.source === 'direct' || data.source === 'internal');
  return assert(ok,
    'first_touch vazio, source=' + data.source + ' (sem campanha, como esperado)',
    'esperado first_touch vazio e source direct/internal, obtido ' + JSON.stringify(data));
}

// 2. Facebook com UTMs completos
async function testFacebookUtms(iframe) {
  await navigate(iframe, fixtureUrl({ t_account: 't02_fb', utm_source: 'facebook', utm_medium: 'paid', utm_campaign: 'campA', fbclid: 'abc123' }));
  await waitReady(iframe);
  var data = iframe.contentWindow.ConnectWebTracking.get();
  var ok = data.first_touch.utm_source === 'facebook' && data.first_touch.fbclid === 'abc123' &&
    data.last_touch.utm_source === 'facebook' && data.source === 'facebook';
  return assert(ok, 'first/last touch = facebook/campA/abc123', 'obtido ' + JSON.stringify(data));
}

}

// 4. Troca Facebook -> Google (bug do merge)
async function testSwitchFbToGoogle(iframe) {
  var url1 = fixtureUrl({ t_account: 't04_switch', utm_source: 'facebook', utm_campaign: 'campA', fbclid: 'abc' });
  await navigate(iframe, url1);
  await waitReady(iframe);

  var url2 = fixtureUrl({ t_account: 't04_switch', utm_source: 'google', gclid: 'xyz' });
  await navigate(iframe, url2);
  await waitReady(iframe);

  var data = iframe.contentWindow.ConnectWebTracking.get();
  var last = data.last_touch;
  var ok = last.utm_source === 'google' && last.gclid === 'xyz' &&
    !last.utm_campaign && !last.fbclid &&
    data.first_touch.utm_source === 'facebook';
  return assert(ok,
    'last_touch limpo (google/xyz, sem campA/fbclid antigos), first_touch preservado (facebook)',
    'last_touch obtido ' + JSON.stringify(last) + ' | first_touch ' + JSON.stringify(data.first_touch));
}

// 7. Retorno direto nao apaga last touch
async function testDirectReturnKeepsLastTouch(iframe) {
  var url1 = fixtureUrl({ t_account: 't07_return', utm_source: 'facebook', utm_campaign: 'campA', fbclid: 'abc' });
  await navigate(iframe, url1);
  await waitReady(iframe);
  var before = iframe.contentWindow.ConnectWebTracking.get().last_touch;

  var url2 = fixtureUrl({ t_account: 't07_return' }); // sem parametros = acesso direto
  await navigate(iframe, url2);
  await waitReady(iframe);
  var after = iframe.contentWindow.ConnectWebTracking.get().last_touch;

  var ok = JSON.stringify(before) === JSON.stringify(after) && after.utm_source === 'facebook';
  return assert(ok, 'last_touch inalterado apos visita direta (' + JSON.stringify(after) + ')',
    'antes ' + JSON.stringify(before) + ' depois ' + JSON.stringify(after));
}

// 8. Multiplas paginas (persistencia)
async function testMultiplePages(iframe) {
  var url1 = fixtureUrl({ t_account: 't08_multi', utm_source: 'google', gclid: 'g1' });
  await navigate(iframe, url1);
  await waitReady(iframe);
  var first = iframe.contentWindow.ConnectWebTracking.get();

  return assert(ok, 'visitor_id e first_touch preservados entre paginas (' + vid1 + ')',
    'vid1=' + vid1 + ' vid2=' + second.visitor_id);
}

// 13. Formulario inicial
async function testInitialForm(iframe) {
  await navigate(iframe, fixtureUrl({ t_account: 't13_form', utm_source: 'facebook', utm_campaign: 'campA' }));
  await waitReady(iframe);
  await sleep(150);
  var form = iframe.contentWindow.document.getElementById('formInitial');
  var field = form.querySelector('input[name="utm_source"]');
  var vid = form.querySelector('input[name="cw_visitor_id"]');
  var ok = field && field.value === 'facebook' && vid && vid.value;
  return assert(ok, 'formulario inicial recebeu utm_source + cw_visitor_id', 'campo utm_source=' + (field && field.value));
}

// 14. Formulario dinamico
async function testDynamicForm(iframe) {
  await navigate(iframe, fixtureUrl({ t_account: 't14_dynform', utm_source: 'facebook', utm_campaign: 'campA' }));
  await waitReady(iframe);
  iframe.contentWindow.__cwAddDynamicForm();
  // O MutationObserver processa em lote via requestAnimationFrame - em aba
  // de fundo/automatizada o rAF pode ser bem mais lento que o normal,
  // entao fazemos polling generoso em vez de um sleep fixo curto.
  await waitFor(function () {
    var form = iframe.contentWindow.document.getElementById('formDynamic');
    var field = form && form.querySelector('input[name="utm_source"]');
    return field && field.value === 'facebook';
  }, 4000);
  var form = iframe.contentWindow.document.getElementById('formDynamic');
  var field = form && form.querySelector('input[name="utm_source"]');
  return assert(field && field.value === 'facebook', 'form dinamico recebeu campos ocultos', 'form/field: ' + (field && field.value));
}

// 16. SPA via pushState
async function testSpaPushState(iframe) {
  await navigate(iframe, fixtureUrl({ t_account: 't16_spa', utm_source: 'facebook', utm_campaign: 'campA' }));
  await waitReady(iframe);
  var before = iframe.contentWindow.ConnectWebTracking.get();

  iframe.contentWindow.__cwPushState('/tracking/fixture.html?t_account=t16_spa&utm_source=google&gclid=zzz');
  await sleep(200);

  var after = iframe.contentWindow.ConnectWebTracking.get();
  var ok = after.last_touch.utm_source === 'google' && after.last_touch.gclid === 'zzz' &&
    !after.last_touch.utm_campaign && after.first_touch.utm_source === 'facebook' &&
    after.visitor_id === before.visitor_id;
  return assert(ok, 'pushState atualizou last_touch sem recriar first_touch/visitor_id',
    'antes ' + JSON.stringify(before.last_touch) + ' depois ' + JSON.stringify(after.last_touch));
}

// 17. Consentimento aceito
async function testConsentGranted(iframe) {
  var url = fixtureUrl({ t_account: 't17_consent', t_consent_required: 'true', utm_source: 'facebook', utm_campaign: 'campA' });
  await navigate(iframe, url);
  await waitReady(iframe);

  var key = storageKeyForTest('t17_consent');
  var beforeStorage = iframe.contentWindow.localStorage.getItem(key);
  var stateBefore = iframe.contentWindow.ConnectWebTracking.consentState();

  iframe.contentWindow.ConnectWebTracking.setConsent(true);
  await sleep(150);

  var afterStorage = iframe.contentWindow.localStorage.getItem(key);
  var data = iframe.contentWindow.ConnectWebTracking.get();
  var ok = beforeStorage === null && stateBefore === 'unknown' && !!afterStorage && data.first_touch.utm_source === 'facebook';
  return assert(ok, 'nada gravado antes do consentimento; apos setConsent(true), registro criado com first_touch correto',
    'beforeStorage=' + beforeStorage + ' stateBefore=' + stateBefore + ' afterStorage=' + !!afterStorage + ' data=' + JSON.stringify(data.first_touch));
}

// 18. Consentimento negado
async function testConsentDenied(iframe) {
  var url = fixtureUrl({ t_account: 't18_consent_deny', t_consent_required: 'true', utm_source: 'facebook' });
  await navigate(iframe, url);
  await waitReady(iframe);

  iframe.contentWindow.ConnectWebTracking.setConsent(false);
  await sleep(150);

  var key = storageKeyForTest('t18_consent_deny');
  var storage = iframe.contentWindow.localStorage.getItem(key);
  var ok = storage === null && iframe.contentWindow.ConnectWebTracking.consentState() === 'denied';
  return assert(ok, 'nenhum dado persistido apos negar consentimento', 'storage=' + storage);
}

// 19. Opt-out persiste entre reloads
async function testOptOut(iframe) {
  var url = fixtureUrl({ t_account: 't19_optout', t_consent_required: 'true', utm_source: 'facebook' });
  await navigate(iframe, url);
  await waitReady(iframe);

  iframe.contentWindow.ConnectWebTracking.optOut();
  await sleep(150);

  var key = storageKeyForTest('t19_optout');
  var storageAfterOptout = iframe.contentWindow.localStorage.getItem(key);
  var cookieHasOptout = iframe.contentWindow.document.cookie.indexOf('cw_tracking_optout_v1__t19_optout_' + RUN_ID) !== -1;

  // recarrega a mesma pagina/conta - opt-out deve ser lido automaticamente
  await navigate(iframe, url);
  await waitReady(iframe);
  var stateAfterReload = iframe.contentWindow.ConnectWebTracking.consentState();
  var storageAfterReload = iframe.contentWindow.localStorage.getItem(key);

  var ok = storageAfterOptout === null && cookieHasOptout && stateAfterReload === 'denied' && storageAfterReload === null;
  return assert(ok, 'opt-out limpou dados e persistiu como negado apos reload',
    'storageAfterOptout=' + storageAfterOptout + ' cookie=' + cookieHasOptout + ' stateAfterReload=' + stateAfterReload);
}

// 20. Expiracao por TTL
async function testExpiry(iframe) {
  var account = 't20_expiry';
  var key = storageKeyForTest(account);
  var oldDate = new Date(Date.now() - 100 * 24 * 60 * 60 * 1000).toISOString();
  var seeded = {
    version: '1.1.0', account: account, visitor_id: 'SEEDED_OLD',
    first_touch: { utm_source: 'old' }, last_touch: { utm_source: 'old' },
    last_touch_source: 'old', source: 'old',
    landing_page: { url: '', path: '', referrer: '', captured_at: oldDate },
    last_page: '', updated_at: oldDate, history: []
  };
  // t_seed_key/t_seed_value precisam ser calculados ANTES de fixtureUrl()
  // sufixar t_account com o RUN_ID, entao usamos storageKeyForTest (que
  // aplica o mesmo sufixo) para as duas coisas baterem.
  var url = fixtureUrl({ t_account: account, t_seed_key: key, t_seed_value: JSON.stringify(seeded) });
  await navigate(iframe, url);
  await waitReady(iframe);

  var data = iframe.contentWindow.ConnectWebTracking.get();
  var ok = data.visitor_id !== 'SEEDED_OLD';
  return assert(ok, 'registro com 100 dias foi descartado (novo visitor_id gerado)', 'visitor_id obtido: ' + data.visitor_id);
}

// 21. Troca de account (isolamento)
async function testAccountSwitch(iframe) {
  var urlA = fixtureUrl({ t_account: 't21_acctA' });
  await navigate(iframe, urlA);
  await waitReady(iframe);
  var vidA = iframe.contentWindow.ConnectWebTracking.get().visitor_id;

  var urlB = fixtureUrl({ t_account: 't21_acctB' });
  await navigate(iframe, urlB);
  await waitReady(iframe);
  var vidB = iframe.contentWindow.ConnectWebTracking.get().visitor_id;

  await navigate(iframe, urlA);
  await waitReady(iframe);

    'vidA=' + vidA + ' vidB=' + vidB + ' vidA(volta)=' + vidA2);
}

// 22. Alteracao dinamica de href para Hotmart (MutationObserver de atributo)
async function testHrefChangeToHotmart(iframe) {
  await navigate(iframe, fixtureUrl({ t_account: 't22_hrefhotmart', utm_source: 'facebook', utm_campaign: 'campA', fbclid: 'shouldnotleak' }));
  await waitReady(iframe);

  iframe.contentWindow.__cwChangeHref('https://checkout.hotmart.com/produtoX');
  var got = await waitFor(function () {
    var h = iframe.contentWindow.document.getElementById('linkInternal').getAttribute('href');
    return h.indexOf('utm_source') !== -1;
  }, 4000);
  var href = iframe.contentWindow.document.getElementById('linkInternal').getAttribute('href');

  var ok = got && href.indexOf('utm_source=facebook') !== -1 && href.indexOf('src=') !== -1 && href.indexOf('fbclid') === -1;
  return assert(ok,
    'href alterado dinamicamente para Hotmart foi decorado (utm+src, sem fbclid)',
    'href obtido: ' + href);
}

// 23. Alteracao dinamica de href de volta para destino nao permitido
// (bug real encontrado na auditoria: matchesDomainList dava falso
// positivo quando o host tinha o mesmo comprimento de "hotmart.com")
async function testHrefChangeBackToUnlisted(iframe) {
  await navigate(iframe, fixtureUrl({ t_account: 't23_hrefback', utm_source: 'facebook', utm_campaign: 'campA' }));
  await waitReady(iframe);

  iframe.contentWindow.__cwChangeHref('https://checkout.hotmart.com/produtoY');
  await waitFor(function () {
    var h = iframe.contentWindow.document.getElementById('linkInternal').getAttribute('href');
    return h.indexOf('utm_source') !== -1;
  }, 4000);

  // "exemplo.com" tem o mesmo numero de caracteres que "hotmart.com" -
  // e exatamente o caso que expunha o bug do matching por comprimento.
  iframe.contentWindow.__cwChangeHref('https://exemplo.com/pagina');
  await sleep(500);
  var href = iframe.contentWindow.document.getElementById('linkInternal').getAttribute('href');

  var ok = href === 'https://exemplo.com/pagina';
  return assert(ok,
    'href alterado de volta para dominio nao permitido nao ficou decorado',
    'href obtido: ' + href + ' (esperado: https://exemplo.com/pagina, sem parametros)');
}

// 24. Hotmart/Kiwify recebem somente os parametros documentados
// (sem click IDs), mas os click IDs continuam armazenados internamente
async function testHotmartKiwifyExcludeClickIds(iframe) {
  await navigate(iframe, fixtureUrl({
    t_account: 't24_noclickids', utm_source: 'facebook', utm_medium: 'paid', utm_campaign: 'campA',
    fbclid: 'fb123', gclid: 'g456', ttclid: 'tt789',
    utm_id: 'uid1', ad_id: 'ad1', campaign_id: 'cid1', adset_id: 'as1'
  }));
  await waitReady(iframe);
  await sleep(150);

  var hotmartHref = iframe.contentWindow.document.getElementById('linkHotmart').getAttribute('href');
  var kiwifyHref = iframe.contentWindow.document.getElementById('linkKiwify').getAttribute('href');
  var raw = iframe.contentWindow.ConnectWebTracking.getRaw();

  // Nem click IDs nem os 4 IDs de campanha/anuncio podem vazar para o
  // checkout: Hotmart/Kiwify documentam oficialmente so os 5 UTMs + src.
  function semParametrosProibidos(href) {
    return ['fbclid', 'gclid', 'ttclid', 'utm_id', 'ad_id', 'campaign_id', 'adset_id']
      .every(function (k) { return href.indexOf(k) === -1; });
  }

  var hotmartOk = hotmartHref.indexOf('utm_source=facebook') !== -1 && hotmartHref.indexOf('src=') !== -1 &&
    semParametrosProibidos(hotmartHref);
  var kiwifyOk = kiwifyHref.indexOf('utm_source=facebook') !== -1 && kiwifyHref.indexOf('src=') !== -1 &&
    semParametrosProibidos(kiwifyHref);
  var storageOk = raw.first_touch.fbclid === 'fb123' && raw.first_touch.gclid === 'g456' &&
    raw.first_touch.ttclid === 'tt789' && raw.first_touch.ad_id === 'ad1' &&
    raw.first_touch.campaign_id === 'cid1' && raw.first_touch.adset_id === 'as1' &&
    raw.first_touch.utm_id === 'uid1';

  var ok = hotmartOk && kiwifyOk && storageOk;
  return assert(ok,
    'Hotmart/Kiwify sem click IDs na URL; click IDs continuam no armazenamento interno',
    'hotmart=' + hotmartHref + ' | kiwify=' + kiwifyHref + ' | armazenado=' + JSON.stringify(raw.first_touch));
}

// 28. Independencia de rede - nenhuma chamada de rede e feita pelo
// tracker durante um ciclo completo (captura, decoracao de links,
// formularios, SPA, consentimento). Verifica na pratica a exigencia
// de que o produto nao depende de nenhuma infraestrutura da ConnectWeb.
async function testNetworkIndependence(iframe) {
  await navigate(iframe, fixtureUrl({
    t_account: 't28_noserver', t_consent_required: 'true',
    utm_source: 'facebook', utm_medium: 'paid', utm_campaign: 'campA',
    fbclid: 'fb1', gclid: 'g1', ttclid: 'tt1'
  }));
  await waitReady(iframe);

  // exercita: consentimento, decoracao de link/form existentes,
  // link e form dinamicos, SPA (pushState), refresh()
  iframe.contentWindow.ConnectWebTracking.setConsent(true);
  await sleep(100);
  iframe.contentWindow.__cwAddDynamicLink();
  iframe.contentWindow.__cwAddDynamicForm();
  await sleep(200);
  iframe.contentWindow.__cwPushState('/tracking/fixture.html?t_account=t28_noserver&utm_source=google&gclid=g2');
  await sleep(200);
  iframe.contentWindow.ConnectWebTracking.refresh();
  iframe.contentWindow.ConnectWebTracking.get();
  iframe.contentWindow.ConnectWebTracking.getRaw();
  await sleep(100);

  // V1.2: os recursos novos tambem precisam ser 100% locais - eventos,
  // lead com dados pessoais, submit de formulario marcado e leitura de
  // fbp/fbc nao podem introduzir nenhuma chamada de rede.
  iframe.contentWindow.ConnectWebTracking.track('view_content');
  iframe.contentWindow.ConnectWebTracking.trackLead({
    name: 'Joao Teste', email: 'joao@exemplo.com', phone: '14999999999'
  });
  iframe.contentWindow.ConnectWebTracking.getEvents();
  iframe.contentWindow.__cwSubmit('formLead');
  await sleep(200);

  var calls = iframe.contentWindow.__cwNetworkCalls || [];
  var ok = calls.length === 0;
  return assert(ok,
    'nenhuma chamada de rede em todo o ciclo, incluindo track/trackLead/submit/fbp-fbc (fetch/XHR/sendBeacon)',
    'chamadas registradas: ' + JSON.stringify(calls));
}

// 35. track('lead'): event_id unico, event_time, sessao e atribuicao;
// PII do trackLead NAO pode ser persistida
async function testTrackLeadEvent(iframe) {
  await navigate(iframe, fixtureUrl({ t_account: 't35_event', utm_source: 'facebook', utm_campaign: 'campA', ad_id: 'AD1' }));
  await waitReady(iframe);

  var cw = iframe.contentWindow.ConnectWebTracking;
  var received = null;
  iframe.contentWindow.addEventListener('connectweb:tracking-event', function (e) { received = e.detail; });

  var e1 = cw.track('lead');
  var e2 = cw.trackLead({ name: 'Joao Teste', email: 'joao@exemplo.com', phone: '14999999999' });
  await sleep(100);

  var data = cw.get();
  var events = cw.getEvents();
  var raw = iframe.contentWindow.localStorage.getItem(storageKeyForTest('t35_event')) || '';

  var idsUnicos = e1.event_id && e2.event_id && e1.event_id !== e2.event_id;
  var estruturaOk = e2.event_name === 'lead' && !!e2.event_time &&
    e2.session_id === data.session_id && e2.visitor_id === data.visitor_id &&
    e2.first_touch.utm_source === 'facebook' && e2.last_touch.ad_id === 'AD1';
  var payloadEntregue = e2.data.email === 'joao@exemplo.com' &&
    received && received.data && received.data.email === 'joao@exemplo.com';
  var persistidoOk = events.length === 2 && !events[1].data &&
    raw.indexOf('joao@exemplo.com') === -1 && raw.indexOf('Joao Teste') === -1 &&
    raw.indexOf('14999999999') === -1;

  var ok = idsUnicos && estruturaOk && payloadEntregue && persistidoOk;
  return assert(ok, 'eventos com event_id unico, sessao/atribuicao corretas; PII entregue no evento mas NAO persistida',
    'idsUnicos=' + idsUnicos + ' estrutura=' + estruturaOk + ' payload=' + payloadEntregue +
    ' persistencia=' + persistidoOk + ' eventos=' + JSON.stringify(events));
}

async function run() {
  clearTrackingCookies(); // limpa restos de execucoes anteriores
  for (var i = 0; i < TESTS.length; i++) {
    await runTest(TESTS[i][0], TESTS[i][1]);
    render();
  }
  render(true);
}

function render(done) {
  var rows = document.getElementById('rows');
  rows.innerHTML = '';
  var passCount = 0;
  results.forEach(function (r, i) {
    var tr = document.createElement('tr');
    if (!r.pass) tr.className = 'fail';
    tr.innerHTML = '<td>' + (i + 1) + '</td><td>' + r.name + '</td>' +
      '<td class="' + (r.pass ? 'pass' : 'fail') + '">' + (r.pass ? 'PASS' : 'FAIL') + '</td>' +
      '<td>' + (r.message || '') + '</td>';
    rows.appendChild(tr);
    if (r.pass) passCount++;
  });
  var summary = document.getElementById('summary');
  var total = TESTS.length;
  var ran = results.length;
  if (!done) {
    summary.textContent = 'Rodando... ' + ran + '/' + total;
  } else {
    summary.innerHTML = passCount === total
      ? '<span class="pass">' + passCount + '/' + total + ' testes passaram</span>'
      : '<span class="fail">' + passCount + '/' + total + ' testes passaram (' + (total - passCount) + ' falharam)</span>';
  }
}

run();
