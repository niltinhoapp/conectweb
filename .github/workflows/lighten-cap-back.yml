name: lighten-cap-back
on:
  push:
    branches: [fix/capacidades-back-claro]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/lighten_cap_back.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html styles.css
          git diff --cached --quiet && exit 0
          git commit -m "fix(home): clareia o verso dos cards de capacidades"
          git push
