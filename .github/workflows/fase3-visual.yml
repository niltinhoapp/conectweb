name: fase3-visual
on:
  push:
    branches:
      - ux/fase3-acabamento-visual
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fase3_visual.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add styles.css
          git commit -m "style(home): refina hierarquia visual e mobile"
          git push
