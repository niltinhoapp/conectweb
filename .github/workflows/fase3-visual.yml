name: Fase 3 visual
on: push
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar acabamento visual
        run: |
          cat >> styles.css <<'EOF'

/* =============================================================
   Fase 3 — acabamento visual institucional
   Hierarquia, ritmo, cards e mobile sem alterar conteúdo/negócio.
   ============================================================= */

/* Mais respiro e leitura entre os blocos institucionais */
.section{padding:clamp(68px,8vw,112px) 0}
.section__head{max-width:720px}
.section__head p{max-width:620px;margin-inline:auto;line-height:1.72}

/* Hero: marca e mensagem primeiro, painel como apoio */
.hero__grid{align-items:center}
.hero h1{max-width:700px}
.hero .lead{max-width:610px;line-height:1.72}
.hero__right .panel{border-color:rgba(255,255,255,.14);box-shadow:0 28px 70px -34px rgba(0,0,0,.72)}
.trustline{gap:10px 18px}

/* Produtos próprios: mesma importância visual para todo o portfólio */
.prodhub__grid{gap:18px}
.prodcard{min-height:238px;padding:26px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:var(--shadow-sm);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.prodcard:hover{transform:translateY(-3px);border-color:#cbd3df;box-shadow:var(--shadow)}
.prodcard__tag{letter-spacing:.045em}
.prodcard__tagline{line-height:1.65}
.prodcard .link{margin-top:auto;padding-top:18px}

/* Capacidades: menos aparência de lista genérica, mais sistema visual */
.solgrid{gap:18px}
.sol{position:relative;min-height:245px;padding:28px;border-radius:20px;overflow:hidden;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.sol:hover{transform:translateY(-3px);border-color:#cbd3df;box-shadow:var(--shadow)}
.sol__ico{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--grad-soft);color:var(--brand-ink);font-size:12px;font-weight:800;letter-spacing:.04em;margin-bottom:22px}
.sol p{line-height:1.65}
.sol .link{display:inline-block;margin-top:10px}

/* Autoridade ganha presença sem competir com o hero */
.section--dark .section__head{max-width:700px}
.partners{gap:20px}
.partner{border-radius:20px;padding:30px}

/* Stack vira selo técnico discreto, não uma nova seção pesada */
.stack{padding-block:6px}
.stack__label{font-size:14px;letter-spacing:.02em;color:var(--muted);font-weight:700}
.stack__chips{gap:8px}
.tchip{border-radius:999px;padding:8px 12px}

/* Diferenciais: leitura mais rápida e consistente */
.diffgrid{gap:16px}
.diff{padding:24px;border-radius:18px}
.diff strong{display:block;margin-bottom:7px}
.diff p{line-height:1.65}

/* Mobile: reduz densidade sem apertar os CTAs */
@media (max-width:760px){
  .section{padding:58px 0}
  .section__head{margin-bottom:30px;text-align:left}
  .section__head h2{font-size:clamp(27px,8vw,34px)}
  .section__head p{font-size:16px;margin-inline:0}
  .hero{padding:54px 0 62px}
  .hero__grid{gap:34px}
  .hero h1{font-size:clamp(35px,10vw,48px)}
  .hero__cta{display:grid;grid-template-columns:1fr;gap:10px}
  .hero__cta .btn{width:100%}
  .trustline{display:grid;gap:8px}
  .prodcard,.sol{min-height:0;padding:22px}
  .prodhub__grid,.solgrid,.diffgrid{gap:12px}
  .partner{padding:24px}
  .stack{padding-block:0}
}
EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css
          git commit -m 'style(home): refina hierarquia visual e mobile'
          git push
