name: remove-arrows
on:
  push:
    branches: [copy/remove-setas-links]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/remove_arrows.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(home): remove setas dos links e CTAs"
          git push
