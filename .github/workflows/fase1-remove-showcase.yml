name: Fase 1 remove showcase
on:
  push:
    branches: [refactor/fase1-remove-showcase]
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fase1-remove-showcase
      - name: Remove showcase e ajusta transicao
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('<section id="produtos"')
          end=s.index('<section id="parceiros"', start)
          removed=s[start:end]
          assert 'Tecnologia ConectWeb em ação' in removed
          s=s[:start]+s[end:]
          s=s.replace('<link rel="stylesheet" href="/showcase-produtos.css?v=1">','')
          assert 'Tecnologia ConectWeb em ação' not in s
          assert '<section id="parceiros"' in s
          assert '<span class="eyebrow">Soluções</span>' in s
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor(home): remove seção Tecnologia ConectWeb em ação"
          git push origin HEAD:refactor/fase1-remove-showcase