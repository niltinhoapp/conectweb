name: refina-capacidades
on:
  push:
    branches: [feat/servicos-cards-interativos]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/refina_capacidades.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html styles.css
          git diff --cached --quiet && exit 0
          git commit -m "feat(home): transforma capacidades em experiência interativa"
          git push
