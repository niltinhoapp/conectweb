name: fix-capacidades-css
on:
  push:
    branches: [fix/capacidades-css-cache]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_capacidades_css.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html styles.css
          git diff --cached --quiet && exit 0
          git commit -m "fix(home): corrige carregamento e exibição dos cards de capacidades"
          git push
