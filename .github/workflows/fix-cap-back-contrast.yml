name: fix-cap-back-contrast
on:
  push:
    branches: [fix/capacidades-contraste-back]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_cap_back_contrast.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html styles.css
          git diff --cached --quiet && exit 0
          git commit -m "fix(home): aumenta contraste e legibilidade do verso dos cards"
          git push
