  <style>
    :root{
      --surface: rgba(255,255,255,.05); --line: rgba(255,255,255,.10); --line2: rgba(255,255,255,.16);
      --text:#eef2ff; --muted: rgba(231,237,255,.78); --muted2: rgba(231,237,255,.62);
      --brand:#22d3ee; --grad: linear-gradient(135deg,#7c3aed,#22d3ee);
      --shadow: 0 24px 70px rgba(0,0,0,.45); --shadow-sm: 0 8px 24px rgba(0,0,0,.25);
    }
    body{ background-color:#060912; background-image: radial-gradient(900px 520px at 12% -5%, rgba(124,58,237,.22), transparent 60%), radial-gradient(760px 460px at 88% 8%, rgba(34,211,238,.16), transparent 58%); color:var(--text); }
    .btn--ghost{ --btn-bg: rgba(255,255,255,.07); --btn-fg:#eef2ff; --btn-bd: rgba(255,255,255,.18); box-shadow:none; }
    .btn--ghost:hover{ --btn-bg: rgba(255,255,255,.12); --btn-bd: rgba(255,255,255,.30); }
    .vcard-wrap{ min-height:100vh; display:grid; place-items:center; padding:28px 18px; }
    .vcard{ width:100%; max-width:420px; background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border:1px solid var(--line2); border-radius:26px; padding:30px 26px 26px; box-shadow: var(--shadow); text-align:center; position:relative; overflow:hidden; }
    .vcard::before{ content:""; position:absolute; inset:0 0 auto 0; height:120px; background: var(--grad); opacity:.18; pointer-events:none; }
    .vcard__logo{ position:relative; width:84px; height:84px; border-radius:24px; margin:6px auto 14px; background: var(--grad); display:grid; place-items:center; color:#04111a; font-weight:900; font-size:34px; box-shadow: var(--shadow-sm); }
    .vcard__name{ font-size:24px; font-weight:900; letter-spacing:-.02em; margin:0; }
    .vcard__role{ color: var(--muted); font-size:14.5px; margin:4px 0 0; font-weight:600; }
    .vcard__tags{ display:flex; gap:7px; justify-content:center; flex-wrap:wrap; margin:16px 0 22px; }
    .vcard__tag{ font-size:12px; font-weight:800; padding:6px 12px; border-radius:999px; background: var(--surface); border:1px solid var(--line2); color: var(--text); }
    .vcard__btns{ display:flex; flex-direction:column; gap:11px; }
    .vcard__btns .btn{ width:100%; }
    .vcard__qr{ margin-top:22px; padding-top:20px; border-top:1px solid var(--line); }
    .vcard__qr img{ width:140px; height:140px; border-radius:14px; background:#fff; padding:8px; margin:10px auto 0; }
    .vcard__qr p{ font-size:12.5px; color: var(--muted2); margin:0; }
    .vcard__foot{ margin-top:18px; font-size:12px; color: var(--muted2); }
    .vcard__foot a{ color: var(--brand); font-weight:700; }
  </style>
</head>
<body>
  <div class="vcard-wrap">
    <main class="vcard">
      <div class="vcard__logo">CW</div>
      <h1 class="vcard__name">Conect Web</h1>
      <p class="vcard__role">Desenvolvimento de Sistemas, Integrações e Automação</p>
      <div class="vcard__tags">
        <span class="vcard__tag">Integração de Sistemas</span>
        <span class="vcard__tag">Sistemas Web</span>
        <span class="vcard__tag">Apps Mobile</span>
      </div>
      <div class="vcard__btns">
        <a class="btn btn--wa btn--lg" id="wa" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 32 32" width="20" height="20" fill="currentColor" aria-hidden="true" focusable="false"><path d="M16.004 3C9.376 3 4 8.373 4 15c0 2.31.652 4.469 1.781 6.305L3 29l7.879-2.734A12.94 12.94 0 0 0 16.004 27C22.63 27 28 21.627 28 15S22.63 3 16.004 3Zm0 22.1a10.06 10.06 0 0 1-5.13-1.404l-.368-.219-4.678 1.624 1.548-4.554-.24-.375A10.07 10.07 0 0 1 5.9 15c0-5.577 4.532-10.1 10.104-10.1S26.1 9.423 26.1 15 21.576 25.1 16.004 25.1Zm5.542-7.564c-.303-.152-1.792-.884-2.07-.985-.278-.101-.48-.152-.682.152-.202.303-.783.985-.96 1.187-.177.202-.354.227-.657.076-.303-.152-1.278-.471-2.434-1.503-.9-.803-1.508-1.796-1.685-2.099-.177-.303-.019-.467.133-.618.137-.136.303-.354.454-.531.152-.177.202-.303.303-.505.101-.202.05-.379-.025-.531-.076-.152-.682-1.646-.935-2.253-.246-.591-.497-.511-.682-.52l-.581-.01c-.202 0-.531.076-.809.379-.278.303-1.06 1.036-1.06 2.529s1.085 2.935 1.236 3.138c.152.202 2.135 3.26 5.174 4.572.723.312 1.287.499 1.727.638.726.231 1.386.199 1.909.121.582-.087 1.792-.733 2.045-1.441.253-.708.253-1.315.177-1.441-.076-.126-.278-.202-.581-.354Z"/></svg>
          Falar no WhatsApp
        </a>
        <a class="btn btn--primary btn--lg" href="https://conectweb.online" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path><path d="M2 12h20"></path></svg>
          Conhecer o site
        </a>
        <a class="btn btn--ghost btn--lg" href="https://conectweb.online/projetos/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg>
          Ver projetos
        </a>
        <button class="btn btn--ghost btn--lg" id="save" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Salvar contato
        </button>
        <button class="btn btn--ghost btn--lg" id="share" type="button" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"></line><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"></line></svg>
          Compartilhar cartão
        </button>
      </div>
      <div class="vcard__qr">
        <p>Aponte a câmera para abrir este cartão</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=0&data=https%3A%2F%2Fconectweb.online%2Fcartao%2F" alt="QR Code do cartão Conect Web" loading="lazy" />
      </div>
      <p class="vcard__foot"><a href="https://conectweb.online">conectweb.online</a></p>
    </main>
  </div>
  <script>
    var NUM = "5514996807881";
    var msg = encodeURIComponent("Olá! Vim pelo cartão da Conect Web e quero falar sobre um projeto.");
    document.getElementById("wa").href = "https://wa.me/" + NUM + "?text=" + msg;
    function trackCartao(eventName){ try{ if(typeof gtag==="function") gtag("event", eventName);}catch(e){} try{ if(typeof fbq==="function") fbq("trackCustom", eventName);}catch(e){} }
    document.getElementById("wa").addEventListener("click", function(){ try{ if(typeof fbq==="function") fbq("track","Contact");}catch(e){} try{ if(typeof gtag==="function") gtag("event","click_whatsapp_cartao");}catch(e){} });
    document.getElementById("save").addEventListener("click", function(){
      trackCartao("click_save_contact_cartao");
      var vcf = ["BEGIN:VCARD","VERSION:3.0","FN:Conect Web","ORG:Conect Web — Sistemas e Integrações","TITLE:Desenvolvimento de Software","TEL;TYPE=CELL:+"+NUM,"URL:https://conectweb.online","NOTE:Sistemas web, integrações, automação e apps mobile.","END:VCARD"].join("\n");
      var blob=new Blob([vcf],{type:"text/vcard"}); var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download="ConectWeb.vcf"; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });
    var shareBtn=document.getElementById("share");
    if(navigator.share){ shareBtn.hidden=false; shareBtn.addEventListener("click", function(){ trackCartao("click_share_cartao"); navigator.share({title:"Conect Web",text:"Desenvolvimento de sistemas, integrações e automação:",url:"https://conectweb.online/cartao/"}).catch(function(){}); }); }
  </script>
</body>
